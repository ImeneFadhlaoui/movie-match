<ion-content [fullscreen]="true">
  <div class="auth-container">
    <div class="brand">
      <h1>Créer un compte</h1>
      <p>Prends une photo et complète tes informations</p>
    </div>

    <!-- Cercle cliquable pour prendre la photo -->
    <button
      type="button"
      class="photo-picker"
      [class.has-photo]="photo() !== null"
      (click)="takePhoto()"
    >
      @if (photo()) {
        <img [src]="photo()" alt="Photo de profil" />
      } @else {
        <ion-icon name="camera"></ion-icon>
        <span>Prendre une photo</span>
      }
    </button>

    <div class="form">
      <div class="row">
        <ion-input
          fill="outline"
          label="Prénom"
          labelPlacement="floating"
          [(ngModel)]="prenom"
        ></ion-input>
        <ion-input
          fill="outline"
          label="Nom"
          labelPlacement="floating"
          [(ngModel)]="nom"
        ></ion-input>
      </div>

      <ion-input
        fill="outline"
        label="Âge"
        labelPlacement="floating"
        type="number"
        [(ngModel)]="age"
      ></ion-input>

      <ion-input
        fill="outline"
        label="Email"
        labelPlacement="floating"
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
      ></ion-input>

      <ion-input
        fill="outline"
        label="Mot de passe"
        labelPlacement="floating"
        type="password"
        autocomplete="new-password"
        helperText="Au moins 6 caractères"
        [(ngModel)]="password"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-button expand="block" shape="round" [disabled]="loading()" (click)="onRegister()">
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          S'inscrire
        }
      </ion-button>
    </div>

    <div class="switch">
      Déjà un compte ?
      <ion-button fill="clear" size="small" routerLink="/login">Se connecter</ion-button>
    </div>
  </div>
</ion-content>
