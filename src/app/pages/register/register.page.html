<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Inscription</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inscription</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-list>
  <ion-item>
    <ion-input
      label="Email"
      labelPlacement="floating"
      type="email"
      [(ngModel)]="email"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      label="Mot de passe"
      labelPlacement="floating"
      type="password"
      [(ngModel)]="password"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      label="Nom"
      labelPlacement="floating"
      type="text"
      [(ngModel)]="nom"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      label="Prénom"
      labelPlacement="floating"
      type="text"
      [(ngModel)]="prenom"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      label="Âge"
      labelPlacement="floating"
      type="number"
      [(ngModel)]="age"
    ></ion-input>
  </ion-item>
  </ion-list>

  <ion-button expand="block" (click)="takePhoto()">
  <ion-icon slot="start" name="camera"></ion-icon>
  Prendre une photo
</ion-button>
@if (photo) {
  <ion-avatar>
    <img [src]="photo" alt="Photo de profil" />
  </ion-avatar>
}

  <ion-button expand="block" (click)="onRegister()">S'inscrire</ion-button>
  <ion-button fill="clear" [routerLink]="['/login']">
    Déjà un compte ? Se connecter
  </ion-button>
</ion-content>
