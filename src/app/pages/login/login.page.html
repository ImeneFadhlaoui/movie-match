<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Connexion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Connexion</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item>
      <ion-input
        label="Email"
        labelPlacement="floating"
        type="email"
        [(ngModel)]="email"
      ></ion-input>
    </ion-item>
    <ion-item>
      <ion-input
        label="Mot de passe"
        labelPlacement="floating"
        type="password"
        [(ngModel)]="password"
      ></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" (click)="onLogin()">Se connecter</ion-button>
  <ion-button fill="clear" [routerLink]="['/register']">
    Pas encore de compte ? S’inscrire
  </ion-button>
</ion-content>
