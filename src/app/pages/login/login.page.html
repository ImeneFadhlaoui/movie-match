<ion-content [fullscreen]="true">
  <div class="auth-container">
    <div class="brand">
      <div class="brand-icon">
        <ion-icon name="film-outline"></ion-icon>
      </div>
      <h1>Movie Match</h1>
      <p>Connecte-toi pour retrouver ta playlist</p>
    </div>

    <div class="form">
      <ion-input
        fill="outline"
        label="Email"
        labelPlacement="floating"
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
      ></ion-input>

      <ion-input
        fill="outline"
        label="Mot de passe"
        labelPlacement="floating"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="password"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-button expand="block" shape="round" [disabled]="loading()" (click)="onLogin()">
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Se connecter
        }
      </ion-button>
    </div>

    <div class="switch">
      Pas encore de compte ?
      <ion-button fill="clear" size="small" routerLink="/register">S'inscrire</ion-button>
    </div>
  </div>
</ion-content>
