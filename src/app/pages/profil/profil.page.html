<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  @if (profile(); as profile) {
    @if (profile.photoURL) {
      <ion-avatar style="width: 120px; height: 120px; margin: 0 auto 16px">
        <img [src]="profile.photoURL" alt="Photo de profil" />
      </ion-avatar>
    }

    <ion-list>
      <ion-item>
        <ion-label>
          <h2>{{ profile.prenom }} {{ profile.nom }}</h2>
          <p>{{ profile.email }}</p>
          <p>{{ profile.age }} ans</p>
        </ion-label>
      </ion-item>
    </ion-list>

    @if (profile.isAdmin) {
      <ion-button expand="block" [routerLink]="['/tabs/admin']">
        Administration
      </ion-button>
    }
  }

  <ion-button expand="block" color="danger" (click)="onLogout()">
    Se déconnecter
  </ion-button>
</ion-content>
